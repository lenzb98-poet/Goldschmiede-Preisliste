<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Preisliste">
  <!-- Ruhiger Grund wie in der App: warmes Papier mit feiner Kante -->
  <rect width="64" height="64" rx="14" fill="#f7f5f0"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#e2dac9" stroke-width="1.5"/>

  <!-- Drei Punkte übereinander: die Zeilen der Liste, im helleren Gold -->
  <g fill="#8b6f47">
    <circle cx="18.5" cy="20.5" r="4.2"/>
    <circle cx="18.5" cy="32"   r="4.2"/>
    <circle cx="18.5" cy="43.5" r="4.2"/>
  </g>

  <!-- Eurozeichen daneben, im dunkleren Gold: Bogen plus zwei Balken.
       Als Pfad gezeichnet statt als Schriftzeichen, damit es überall
       gleich aussieht und keine Schrift geladen werden muss. -->
  <g fill="none" stroke="#6a5334" stroke-linecap="round">
    <path d="M47.31 22.99 A11 11 0 1 0 47.31 41.01" stroke-width="3.2"/>
    <path d="M29 28.92 H45.62" stroke-width="2.8"/>
    <path d="M29 35.08 H45.62" stroke-width="2.8"/>
  </g>
</svg>
