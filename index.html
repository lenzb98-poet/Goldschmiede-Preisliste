<meta name="theme-color" content="#f7f5f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root{
    --bg:#f7f5f0;
    --paper:#fffefb;
    --line:#e8e2d6;
    --line-firm:#d3cab6;
    --ink:#2a2520;
    --ink-soft:#857c6d;
    --gold:#8b6f47;
    --gold-deep:#6a5334;
    --gold-wash:#f1e9da;
    --warn:#9c4a2f;
    --r:16px;
    --tap:52px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font:400 18px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding-bottom:40px;
  }
  input,button,select{font:inherit;color:inherit;}
  button{cursor:pointer;background:none;border:none;padding:0;}

  .wrap{max-width:940px;margin:0 auto;padding:0 16px 16px;}

  /* ---------- Kopf ---------- */
  .masthead{padding:20px 0 10px;text-align:center;}
  .masthead h1{
    margin:0;font-size:1.25rem;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--gold-deep);
  }
  .masthead p{margin:5px 0 0;font-size:.82rem;color:var(--ink-soft);letter-spacing:.03em;}

  /* ---------- Suche ---------- */
  .searchbar{position:sticky;top:0;z-index:30;background:var(--bg);padding:8px 0 14px;}
  .searchbar-inner{position:relative;}
  #search{
    width:100%;height:var(--tap);
    padding:0 46px 0 20px;
    font-size:1.1rem;
    background:var(--paper);
    border:1.5px solid var(--line-firm);
    border-radius:var(--r);
  }
  #search::placeholder{color:var(--ink-soft);}
  #search:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-wash);}
  .search-clear{
    position:absolute;right:6px;top:6px;
    width:40px;height:40px;border-radius:10px;
    font-size:1.3rem;color:var(--ink-soft);display:none;
  }
  .search-clear:hover{background:var(--gold-wash);color:var(--gold-deep);}
  .searching .search-clear{display:block;}

  /* ---------- Abschnitte ---------- */
  .section{margin-bottom:30px;}
  .section-head{
    display:flex;align-items:baseline;gap:10px;margin:0 2px 12px;
  }
  .section-head h2{
    margin:0;font-size:.8rem;font-weight:700;letter-spacing:.11em;
    text-transform:uppercase;color:var(--ink-soft);
  }
  .section-head .count{font-size:.8rem;color:var(--ink-soft);}

  /* ---------- Kategorie-Kacheln ---------- */
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
  .cat{
    position:relative;background:var(--paper);border:1.5px solid var(--line);
    border-radius:var(--r);overflow:hidden;
  }
  .cat-open{
    display:block;width:100%;text-align:left;
    padding:20px 52px 20px 20px;min-height:92px;
  }
  .cat-open:hover{background:var(--gold-wash);}
  .cat-name{display:block;font-size:1.2rem;font-weight:600;line-height:1.25;}
  .cat-sub{display:block;margin-top:5px;font-size:.82rem;color:var(--ink-soft);}
  .cat-edit{
    position:absolute;top:8px;right:8px;
    width:40px;height:40px;border-radius:10px;
    font-size:1rem;color:var(--ink-soft);
  }
  .cat-edit:hover{background:var(--gold-wash);color:var(--gold-deep);}
  .cat.editing .cat-open,.cat.editing .cat-edit{display:none;}
  .cat-editor{padding:14px;display:none;}
  .cat.editing .cat-editor{display:block;}
  .cat-editor input{
    width:100%;height:46px;padding:0 12px;margin-bottom:10px;
    background:#fff;border:1.5px solid var(--line-firm);border-radius:10px;font-size:1.05rem;
  }
  .cat-editor input:focus{outline:none;border-color:var(--gold);}
  .cat-editor-row{display:flex;gap:8px;flex-wrap:wrap;}

  /* Anordnen: Pfeile statt Ziehen. Am Tresen soll nichts gehalten oder
     gezogen werden müssen, und auf dem Tablet ist Ziehen fummelig. */
  .ordnen-knopf{
    margin-left:auto;font-size:.8rem;font-weight:600;
    color:var(--gold-deep);padding:7px 12px;border-radius:9px;
    background:var(--gold-wash);
  }
  .ordnen-knopf:hover{background:var(--gold);color:#fff;}
  .cat-move{display:none;gap:8px;padding:0 12px 12px;}
  .cats.ordnen .cat-move{display:flex;}
  .cats.ordnen .cat-edit{display:none;}
  .cats.ordnen .cat-open{pointer-events:none;}   /* nicht versehentlich öffnen */
  .cats.ordnen .cat{border-color:var(--line-firm);}
  .cat-move button{
    flex:1;min-height:46px;border-radius:11px;
    background:var(--gold-wash);color:var(--gold-deep);
    font-size:1.2rem;font-weight:600;line-height:1;
  }
  .cat-move button:hover:not(:disabled){background:var(--gold);color:#fff;}
  .cat-move button:disabled{opacity:.3;cursor:default;}

  .cat-add{display:flex;gap:10px;margin-top:14px;}
  .cat-add input{
    flex:1;height:var(--tap);padding:0 18px;
    background:var(--paper);border:1.5px dashed var(--line-firm);
    border-radius:var(--r);font-size:1.02rem;
  }
  .cat-add input:focus{outline:none;border-style:solid;border-color:var(--gold);}

  /* ---------- Knöpfe ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    min-height:46px;padding:0 20px;border-radius:12px;
    font-size:.98rem;font-weight:600;
    background:var(--gold);color:#fff;
  }
  .btn:hover{background:var(--gold-deep);}
  .btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line-firm);}
  .btn.ghost:hover{background:var(--gold-wash);border-color:var(--gold);}
  .btn.warn{background:var(--warn);color:#fff;}
  .btn.warn:hover{background:#823a23;}

  /* ---------- Zeilen ---------- */
  .rows{display:flex;flex-direction:column;gap:12px;}
  /* Die Tab-Reihenfolge folgt dem DOM: Bezeichnung, Preis, Notiz, Dauer.
     Die Darstellung wird davon über feste Grid-Plätze entkoppelt,
     damit der Preis rechts steht, aber als zweites angesprungen wird. */
  .row{
    background:var(--paper);border:1.5px solid var(--line);
    border-radius:var(--r);padding:14px;
    display:grid;
    grid-template-columns:76px minmax(0,1fr) 208px;
    grid-template-rows:auto auto;
    column-gap:16px;row-gap:8px;align-items:start;
    transition:border-color .18s,background-color .5s;
  }
  .row > .thumb      {grid-column:1;grid-row:1 / span 2;}
  .row > .r-name     {grid-column:2;grid-row:1;align-self:center;}
  .row > .price-field{grid-column:3;grid-row:1;align-self:center;}
  .row > .r-meta     {grid-column:2;grid-row:2;}
  .row > .r-side     {grid-column:3;grid-row:2;}
  .row:focus-within{border-color:var(--gold);}
  .row.flash{background:var(--gold-wash);}

  /* Bild */
  .thumb{
    width:76px;height:76px;border-radius:12px;overflow:hidden;
    background:var(--gold-wash);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .ph{font-size:1.5rem;color:#b9ad95;font-weight:300;}
  .thumb.laedt::after{
    content:"";position:absolute;inset:0;
    background:var(--gold-wash);opacity:.75;
  }
  .thumb-btn{position:absolute;inset:0;}
  .thumb-pick{position:absolute;inset:0;cursor:pointer;}
  .thumb-pick input{display:none;}
  /* Bild entfernen: kleines Zeichen auf dem Vorschaubild statt eigener Knopf */
  .thumb-off{
    position:absolute;top:2px;right:2px;
    width:24px;height:24px;border-radius:7px;
    background:rgba(255,255,255,.92);color:var(--warn);
    font-size:.8rem;line-height:1;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .thumb-off:hover{background:var(--warn);color:#fff;}

  /* Textfelder */
  .f{
    width:100%;background:transparent;border:1.5px solid transparent;
    border-radius:9px;padding:7px 9px;
  }
  .f:hover{border-color:var(--line);}
  .f:focus{outline:none;background:#fff;border-color:var(--gold);}
  .f-name{font-size:1.16rem;font-weight:600;}
  .f-name::placeholder{font-weight:400;}
  .r-meta{display:flex;gap:8px;flex-wrap:wrap;min-width:0;}
  /* min-width:0 — sonst hält jedes Eingabefeld seine Eigenbreite
     von rund 20 Zeichen und Notiz/Dauer brechen unnötig um. */
  .r-meta .f{flex:1 1 140px;width:auto;min-width:0;font-size:.94rem;color:var(--ink-soft);}
  .f-note:focus,.f-time:focus{color:var(--ink);}
  .r-cat{flex:1 1 100%;font-size:.76rem;color:var(--ink-soft);padding:0 9px;}
  ::placeholder{color:#b3aa99;}

  /* Preisspalte */
  .r-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .price-field{position:relative;width:100%;}
  .price-field .f-price{
    width:100%;text-align:right;
    padding:6px 34px 6px 9px;
    font-size:1.7rem;font-weight:600;line-height:1.2;
    letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  }
  .price-field .cur{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font-size:1.25rem;color:var(--ink-soft);pointer-events:none;
  }
  .stamp{font-size:.76rem;color:var(--ink-soft);text-align:right;padding-right:2px;}
  .stamp.old{color:var(--warn);font-weight:600;}
  .rowtools{display:flex;gap:2px;justify-content:flex-end;margin-top:2px;}
  .tool{
    width:40px;height:40px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:.95rem;color:var(--ink-soft);
  }
  .tool:hover{background:var(--gold-wash);color:var(--gold-deep);}
  .tool.show{width:auto;padding:0 15px;font-size:.85rem;font-weight:600;color:var(--gold-deep);background:var(--gold-wash);}
  .tool.show:hover{background:var(--gold);color:#fff;}
  /* Wörter statt Zeichen — am Tresen soll nichts gedeutet werden müssen */
  .tool.word{width:auto;padding:0 10px;font-size:.8rem;}
  .tool.word[data-del]:hover{background:#f6e7e2;color:var(--warn);}
  .confirm{
    display:flex;gap:8px;align-items:center;justify-content:flex-end;
    flex-wrap:wrap;font-size:.85rem;color:var(--warn);
  }
  .confirm button{padding:8px 12px;border-radius:8px;font-size:.85rem;font-weight:600;}
  .confirm .yes{background:var(--warn);color:#fff;}
  .confirm .no{background:var(--line);color:var(--ink);}

  .row-add{
    width:100%;min-height:var(--tap);margin-top:14px;
    border:2px dashed var(--line-firm);border-radius:var(--r);
    color:var(--gold-deep);font-size:1.04rem;font-weight:600;
  }
  .row-add:hover{background:var(--gold-wash);border-color:var(--gold);}

  /* ---------- Kategorie-Ansicht ---------- */
  .cathead{display:flex;align-items:center;gap:6px;margin-bottom:18px;}
  .cathead h2{margin:0;font-size:1.35rem;font-weight:600;flex:1;min-width:0;}
  .back{width:var(--tap);height:var(--tap);border-radius:12px;font-size:1.3rem;color:var(--gold-deep);flex-shrink:0;}
  .back:hover{background:var(--gold-wash);}

  .blank{text-align:center;color:var(--ink-soft);padding:34px 16px;font-size:.98rem;}

  /* ---------- Kundenansicht ---------- */
  .stage{
    position:fixed;inset:0;z-index:80;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px;text-align:center;overflow:auto;
  }
  .stage img{
    max-width:min(340px,70vw);max-height:34vh;
    border-radius:14px;margin-bottom:26px;object-fit:contain;
  }
  .stage img{
    max-width:min(340px,70vw);max-height:34vh;
    border-radius:14px;margin-bottom:26px;object-fit:contain;
  }
  .stage .s-name{
    font-size:clamp(1.5rem,4.5vw,2.3rem);font-weight:600;
    line-height:1.2;max-width:16ch;margin-bottom:18px;
  }
  .stage .s-price{
    font-size:clamp(3.6rem,15vw,7rem);font-weight:600;
    line-height:1;letter-spacing:-.02em;color:var(--gold-deep);
    font-variant-numeric:tabular-nums;
  }
  .stage .s-note{
    margin-top:20px;font-size:clamp(1rem,2.6vw,1.25rem);color:var(--ink-soft);max-width:22ch;
  }
  .stage .s-time{margin-top:8px;font-size:.98rem;color:var(--ink-soft);}
  .stage .s-close{
    position:absolute;top:18px;right:18px;
    width:var(--tap);height:var(--tap);border-radius:12px;
    font-size:1.5rem;color:var(--ink-soft);
  }
  .stage .s-close:hover{background:var(--gold-wash);}
  .stage .s-hint{position:absolute;bottom:20px;font-size:.78rem;color:#bdb4a2;}

  /* ---------- Bild groß ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:90;background:rgba(28,23,16,.88);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .lightbox img{max-width:100%;max-height:88vh;border-radius:12px;}
  .lightbox button{
    position:absolute;top:18px;right:20px;
    width:var(--tap);height:var(--tap);border-radius:12px;
    font-size:1.6rem;color:#fff;
  }

  /* ---------- Daten ---------- */
  .data{
    margin-top:34px;padding:20px;
    background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);
  }
  .data h2{margin:0 0 14px;font-size:.8rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);}
  .data-row{display:flex;gap:10px;flex-wrap:wrap;}
  .data-note{margin-top:14px;font-size:.83rem;color:var(--ink-soft);line-height:1.5;}
  .data-note b{color:var(--ink);font-weight:600;}

  @media (max-width:720px){
    body{font-size:17px;}
    /* Schmal: alles untereinander — Bezeichnung, Preis, Notiz/Dauer,
       zuletzt Datum und Knöpfe. Keine "auto"-Spalte für den Preis:
       ein Eingabefeld zieht sonst seine Eigenbreite von rund
       20 Zeichen und drückt die Bezeichnung weg. */
    .row{
      grid-template-columns:56px minmax(0,1fr);
      grid-template-rows:auto auto auto auto;
      column-gap:10px;row-gap:6px;
    }
    .row > .thumb      {grid-column:1;grid-row:1 / span 2;}
    .row > .r-name     {grid-column:2;grid-row:1;align-self:center;}
    .row > .price-field{grid-column:2;grid-row:2;align-self:center;}
    .row > .r-meta     {grid-column:1 / -1;grid-row:3;}
    .row > .r-side     {grid-column:1 / -1;grid-row:4;align-items:stretch;}
    .thumb{width:56px;height:56px;}
    .price-field .f-price{font-size:1.8rem;}
    .stamp{text-align:left;}
    .rowtools{justify-content:flex-start;}
    .confirm{justify-content:flex-start;}
  }

  /* hidden muss gewinnen: .gate setzt display:flex und würde das Attribut
     sonst aussticht — die Schicht bliebe unsichtbar liegen und finge alle
     Klicks ab. */
  [hidden]{display:none !important;}

  /* ---------- Logo ---------- */
  /* Freigestellt, damit der Papierton durchscheint statt eines weißen
     Kastens. Auf der Anmeldung die volle Marke, im Betrieb nur die
     Bildmarke — der Schriftzug wäre dort entweder unleserlich klein
     oder würde zu viel Höhe kosten. */
  .gate-logo{
    display:block;width:min(210px,60vw);height:auto;
    margin:0 auto 24px;
  }
  .mast-logo{
    display:block;height:36px;width:auto;
    margin:0 auto 12px;
  }
  @media (max-width:720px){
    .mast-logo{height:30px;}
  }

  /* ---------- Anmeldung ---------- */
  .gate{
    position:fixed;inset:0;z-index:60;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .gate-box{width:100%;max-width:360px;text-align:center;}
  .gate-box h2{
    margin:0 0 6px;font-size:1.15rem;font-weight:600;
    letter-spacing:.09em;text-transform:uppercase;color:var(--gold-deep);
  }
  .gate-box p{margin:0 0 22px;font-size:.86rem;color:var(--ink-soft);}
  .gate-box input{
    width:100%;height:var(--tap);padding:0 18px;margin-bottom:12px;
    font-size:1.1rem;text-align:center;
    background:var(--paper);border:1.5px solid var(--line-firm);border-radius:var(--r);
  }
  .gate-box input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-wash);}
  .gate-box .btn{width:100%;}
  .gate-fehler{
    margin-top:14px;font-size:.88rem;color:var(--warn);font-weight:600;min-height:1.2em;
  }

  /* ---------- Statuszeile ---------- */
  .status{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:18px;z-index:50;
    padding:11px 20px;border-radius:12px;
    font-size:.9rem;font-weight:600;
    background:var(--ink);color:#fff;
    box-shadow:0 4px 18px rgba(0,0,0,.22);
    opacity:0;pointer-events:none;transition:opacity .2s;
    max-width:90vw;
  }
  .status.an{opacity:1;}
  .status.schlimm{background:var(--warn);}

  /* ---------- Kopfleiste ---------- */
  .abmelden{
    position:absolute;top:20px;right:0;
    font-size:.8rem;color:var(--ink-soft);
    padding:8px 12px;border-radius:9px;
  }
  .abmelden:hover{background:var(--gold-wash);color:var(--gold-deep);}
  .masthead{position:relative;}

  .laedt{text-align:center;color:var(--ink-soft);padding:40px 16px;}
</style>
</head>

// Komma und Punkt gleichermaßen als Dezimaltrenner
function toNumber(input){
  if(input == null) return null;
  let s = String(input).trim().replace(/[^\d.,-]/g, "");
  if(!s) return null;
  const hasComma = s.includes(","), hasDot = s.includes(".");
  if(hasComma && hasDot){
    s = s.lastIndexOf(",") > s.lastIndexOf(".")
      ? s.replace(/\./g, "").replace(",", ".")
      : s.replace(/,/g, "");
  }else if(hasComma){
    s = s.replace(",", ".");
  }else if(hasDot && /\.\d{3}\b/.test(s) && !/\.\d{1,2}$/.test(s)){
    s = s.replace(/\./g, "");   // 1.250 → 1250
  }
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : null;
}

const money = n => (n == null || !Number.isFinite(n))
  ? "" : n.toLocaleString("de-DE", { minimumFractionDigits:2, maximumFractionDigits:2 });

function dateShort(iso){
  const d = iso ? new Date(iso) : null;
  return (d && !isNaN(d)) ? d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}) : "";
}
function ageInDays(iso){
  const d = iso ? new Date(iso) : null;
  return (d && !isNaN(d)) ? (Date.now() - d.getTime()) / 864e5 : Infinity;

  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

/* ---------- Dauer ----------
   Eingetragen wird in Stunden ("1,5", "0,25"); andere Schreibweisen
   werden ebenso verstanden ("20 Min.", "1:30", "1 Std 30", "2 Tage").
   Angezeigt wird in vollen Minuten, mit vorangestellten Stunden ab
   einer vollen Stunde: 1,5 -> "1 Std. 30 Min.", 0,25 -> "15 Min." */
function parseDuration(input){
  if(input == null) return null;
  const s = String(input).trim().toLowerCase();
  if(!s) return null;

  // 1:30 als Stunden:Minuten. Nur der Doppelpunkt zählt hier — der Punkt
  // ist in dieser App durchgehend Dezimaltrenner (wie beim Preis), sonst
  // würde aus "1.25" still 1:25 statt 1,25 Stunden.
  const clock = s.match(/^(\d+)\s*:\s*([0-5]\d)\s*(?:h|std\.?|stunden?)?$/);
  if(clock) return Number(clock[1]) + Number(clock[2]) / 60;

  const factor = u => {
    if(/^(min|minute|minuten|m)$/.test(u)) return 1 / 60;
    if(/^(h|std|stunde|stunden|std\.)$/.test(u)) return 1;
    if(/^(t|tag|tage|d)$/.test(u)) return WORK_DAY_HOURS;
    return null;
  };

  let total = 0, found = false, lastWasHours = false;
  const token = /(\d+(?:[.,]\d+)?)\s*([a-zäöü.]*)/g;
  let m;
  while((m = token.exec(s)) !== null){
    const wert = parseFloat(m[1].replace(",", "."));
    if(!Number.isFinite(wert)) continue;
    const einheit = m[2].replace(/\.$/, "");
    let f = einheit ? factor(einheit) : null;
    if(einheit && f === null) return null;        // unbekannte Einheit → Text belassen
    if(f === null){
      // Zahl ohne Einheit sind Stunden: "1,5" = 1 Std. 30 Min.,
      // "0,25" = 15 Min., "2" = 2 Std.
      // Einzige Ausnahme: die nachgestellte Zahl in "1 Std 30" oder
      // "1h30" sind Minuten.
      f = lastWasHours ? 1 / 60 : 1;
    }
    lastWasHours = f === 1;
    total += wert * f;
    found = true;
  }
  return found ? total : null;
}

// In vollen Minuten rechnen — dadurch bleibt die Anzeige beim wiederholten
// Bestätigen unverändert und driftet nicht durch Rundung ab.
function formatDuration(hours){
  if(hours == null || !Number.isFinite(hours)) return "";
  const min = Math.round(hours * 60);
  const std = Math.floor(min / 60), rest = min % 60;
  if(std === 0) return `${rest} Min.`;
  if(rest === 0) return `${std} Std.`;
  return `${std} Std. ${rest} Min.`;
}

// Freitext in Stunden umschreiben; was sich nicht deuten lässt
// (etwa "nach Aufwand"), bleibt unverändert stehen.
function normalizeDuration(text){
  const h = parseDuration(text);
  return h === null ? String(text ?? "").trim() : formatDuration(h);
}

/* ============================================================
   Statusmeldungen
   ============================================================ */
const statusEl = document.getElementById("status");
let statusTimer = null;
function melde(text, schlimm){
  clearTimeout(statusTimer);
  statusEl.textContent = text;
  statusEl.classList.toggle("schlimm", !!schlimm);
  statusEl.classList.add("an");
  statusTimer = setTimeout(() => statusEl.classList.remove("an"), schlimm ? 6000 : 1800);
}

// Jeder Schreibvorgang läuft hier durch. Ein fehlgeschlagener Preis darf
// nicht stillschweigend verschwinden — am Tresen wäre der Preis sonst
// scheinbar geändert und in Wahrheit nicht.
const schlaf = ms => new Promise(r => setTimeout(r, ms));

/* Ein eben erst ausgestellter Token wird von manchen Supabase-Knoten für
   den Bruchteil einer Sekunde abgelehnt ("JWT issued at future"): die Uhren
   der Knoten laufen minimal auseinander, und die App fragt unmittelbar nach
   der Token-Erneuerung an. In den Protokollen lag jeder Fehlschlag unter
   einer Sekunde nach Ausstellung, jeder Abruf ab 16 Sekunden lief. Kurz
   warten und dieselbe Anfrage wiederholen löst es also — aufgeben nicht. */
function istTokenFehler(fehler){
  const t = String((fehler && (fehler.message || fehler.msg || fehler.error)) || "").toLowerCase();
  return t.includes("issued at future") || t.includes("jwt") || t.includes("token");
}
const istAbgelaufen = fehler =>
  /expired|abgelaufen/i.test(String((fehler && fehler.message) || ""));

async function mitGeduld(aktion){
  const wartezeiten = [500, 1200, 2500];
  let letzter = null;
  for(let versuch = 0; versuch <= wartezeiten.length; versuch++){
    const antwort = await aktion();
    if(!antwort || !antwort.error) return antwort;
    letzter = antwort.error;
    if(!istTokenFehler(letzter) || versuch === wartezeiten.length) break;
    // Bei einem abgelaufenen Token hilft Warten nicht, ein neuer schon.
    if(istAbgelaufen(letzter)){
      try{ await sb.auth.refreshSession(); }catch(_){ /* dann eben nicht */ }
    }
    await schlaf(wartezeiten[versuch]);
  }
  return { data:null, error: letzter };
}

async function schreibe(beschreibung, aktion){
  try{
    const { data, error } = await mitGeduld(aktion);
    if(error) throw error;
    return data;
  }catch(err){
    console.error(beschreibung, err);
    melde(beschreibung + " fehlgeschlagen: " + (err.message || err), true);
    throw err;
  }
}

// schreibe() hat den Fehler bereits gemeldet und weitergeworfen, damit der
// Aufrufer abbrechen kann. Bedienhandler hängen hier durch, sonst bleibt
// eine unbehandelte Rejection zurück.
const handler = fn => (...a) => Promise.resolve(fn(...a)).catch(() => {});

   Daten

let data = { categories: [], entries: [] };

const catById   = id => data.categories.find(c => c.id === id);
const entryById = id => data.entries.find(e => e.id === id);
const entriesOf = id => data.entries.filter(e => e.categoryId === id);

// Die Datenbank nennt die Dauer "duration" ("time" ist in SQL belegt)
// und schreibt in Schlangenschrift. Hier wird einmal übersetzt.
const ausDb = r => ({
  id: r.id,
  categoryId: r.category_id,
  name: r.name || "",
  price: r.price == null ? null : Number(r.price),
  priceDate: r.price_date,
  note: r.note || "",
  time: r.duration || "",
  position: r.position,
  lastUsedAt: r.last_used_at,
  imagePath: r.image_path || null
});

async function ladeAlles(){
  const [k, z] = await Promise.all([
    mitGeduld(() => sb.from("categories").select("*").order("position")),
    mitGeduld(() => sb.from("entries").select("*").order("position"))
  ]);
  if(k.error) throw k.error;
  if(z.error) throw z.error;
  data.categories = k.data.map(c => ({ id:c.id, name:c.name, position:c.position }));
  data.entries    = z.data.map(ausDb);
  await signiereAlle();
}

/* ---------- Bilder ----------
   Die Ablage ist nicht öffentlich. Angezeigt wird über unterschriebene
   Adressen, die nach einiger Zeit verfallen; beim nächsten Öffnen der
   Seite werden sie neu geholt. */
async function signiere(pfad){
  const { data: d, error } = await mitGeduld(() =>
    sb.storage.from(BILDER).createSignedUrl(pfad, SIGNIERT_SEK));
  if(error){ console.error("Bildadresse", error); return null; }
  return d.signedUrl;
}

async function signiereAlle(){
  const pfade = data.entries.filter(e => e.imagePath).map(e => e.imagePath);
  if(!pfade.length) return;
  const { data: liste, error } = await mitGeduld(() =>
    sb.storage.from(BILDER).createSignedUrls(pfade, SIGNIERT_SEK));
  if(error){ console.error("Bildadressen", error); return; }
  const karte = {};
  (liste || []).forEach((x, i) => {
    const p = x.path || pfade[i];
    if(x.signedUrl) karte[p] = x.signedUrl;
  });
  data.entries.forEach(e => { if(e.imagePath) e.imageUrl = karte[e.imagePath] || null; });
}

// Vor dem Hochladen verkleinern — ergibt ein Blob, kein base64.
function verkleinereBild(file){
  return new Promise((erfuellen, ablehnen) => {
    const leser = new FileReader();
    leser.onerror = () => ablehnen(new Error("Die Datei konnte nicht gelesen werden."));
    leser.onload = ev => {
      const bild = new Image();
      bild.onerror = () => ablehnen(new Error("Das Bild konnte nicht geladen werden."));
      bild.onload = () => {
        let w = bild.width, h = bild.height;
        const faktor = Math.min(1, BILD_MAX / Math.max(w, h));
        w = Math.round(w * faktor); h = Math.round(h * faktor);
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        const ctx = cv.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);   // Transparenz → weiß
        ctx.drawImage(bild, 0, 0, w, h);
        cv.toBlob(
          b => b ? erfuellen(b) : ablehnen(new Error("Das Bild konnte nicht umgewandelt werden.")),
          "image/jpeg", BILD_Q);
      };
      bild.src = ev.target.result;
    };
    leser.readAsDataURL(file);
  });
}

async function bildHochladen(eintrag, datei){
  const kachel = app.querySelector(`.thumb[data-thumb="${eintrag.id}"]`);
  if(kachel) kachel.classList.add("laedt");
  try{
    const blob = await verkleinereBild(datei);
    const alterPfad = eintrag.imagePath;
    const pfad = `${eintrag.id}/${Date.now()}.jpg`;

    await schreibe("Bild hochladen", () =>
      sb.storage.from(BILDER).upload(pfad, blob, { contentType:"image/jpeg" }));

    const reihe = await schreibe("Bild vermerken", () =>
      sb.from("entries").update({ image_path: pfad }).eq("id", eintrag.id).select().single());
    Object.assign(eintrag, ausDb(reihe));
    eintrag.imageUrl = await signiere(pfad);

    // Das ersetzte Bild wegräumen, sonst sammeln sich Karteileichen an.
    if(alterPfad) await sb.storage.from(BILDER).remove([alterPfad]);

    render();
    melde("Bild gespeichert");
  }catch(err){
    if(kachel) kachel.classList.remove("laedt");
    if(!/fehlgeschlagen/.test(String(err && err.message))) melde(err.message || String(err), true);
  }
}

async function bildEntfernen(eintrag){
  const pfad = eintrag.imagePath;
  await schreibe("Bild entfernen", () =>
    sb.from("entries").update({ image_path: null }).eq("id", eintrag.id));
  eintrag.imagePath = null; eintrag.imageUrl = null;
  if(pfad) await sb.storage.from(BILDER).remove([pfad]);
  render();
  melde("Bild entfernt");
}

// Beim Löschen einer Zeile oder Kategorie bleiben die Dateien sonst liegen —
// die Kaskade in der Datenbank erreicht die Ablage nicht.
async function bilderWegraeumen(eintraege){
  const pfade = eintraege.map(e => e.imagePath).filter(Boolean);
  if(pfade.length) await sb.storage.from(BILDER).remove(pfade);
}

async function markUsed(id){
  const e = entryById(id);
  if(!e) return;
  const jetzt = new Date().toISOString();
  if(e.lastUsedAt && (Date.now() - new Date(e.lastUsedAt).getTime()) < 60000) return; // nicht bei jedem Tastendruck
  e.lastUsedAt = jetzt;
  const { error } = await sb.from("entries").update({ last_used_at: jetzt }).eq("id", id);
  if(error) console.error("Zuletzt benutzt", error);
}

const zuletztBenutzt = () => data.entries
  .filter(e => e.lastUsedAt)
  .sort((a,b) => new Date(b.lastUsedAt) - new Date(a.lastUsedAt))
  .slice(0, RECENT_MAX);

/* ============================================================

function rowHTML(e, opts){
  opts = opts || {};
  const cat = catById(e.categoryId);
  const old = ageInDays(e.priceDate) > OLD_DAYS;
  const stamp = e.priceDate
    ? `<div class="stamp ${old ? "old" : ""}">Preis vom ${dateShort(e.priceDate)}${old ? " &middot; prüfen?" : ""}</div>`
    : `<div class="stamp">noch kein Preis eingetragen</div>`;

  // DOM-Reihenfolge = Tab-Reihenfolge: Bezeichnung, Preis, Notiz, Dauer.
  // Die Grid-Plätze in der CSS sorgen für die Optik, alle Knöpfe stehen auf tabindex="-1".
  // Steht ein Pfad in der Zeile, aber die Adresse fehlt, ist das Signieren
  // schiefgegangen. Dann darf hier kein "+" stehen, sonst überschreibt man
  // versehentlich ein vorhandenes Bild.
  const hatBild = !!e.imagePath;
  const thumb = hatBild
    ? `<img src="${e.imageUrl || ""}" alt="">
       ${e.imageUrl ? `<button class="thumb-btn" data-big="${e.id}" tabindex="-1" title="Bild groß zeigen"></button>` : ""}
       <button class="thumb-off" data-unimg="${e.id}" tabindex="-1" title="Bild entfernen">&#10005;</button>`
    : `<span class="ph">+</span>
       <label class="thumb-pick" title="Bild hinzufügen">
         <input type="file" accept="image/*" data-pick="${e.id}" tabindex="-1">
       </label>`;

  return `
  <div class="row" data-row="${e.id}">
    <div class="thumb" data-thumb="${e.id}">${thumb}</div>

    <div class="r-name">
      <input class="f f-name" data-f="name" data-id="${e.id}" value="${esc(e.name)}" placeholder="Bezeichnung">
    </div>

    <div class="price-field">
      <input class="f f-price" data-f="price" data-id="${e.id}" inputmode="decimal"
             value="${e.price != null ? money(e.price) : ""}" placeholder="—">
      <span class="cur">&euro;</span>
    </div>

    <div class="r-meta">
      <input class="f f-note" data-f="note" data-id="${e.id}" value="${esc(e.note)}" placeholder="Notiz">
      <input class="f f-time" data-f="time" data-id="${e.id}" value="${esc(e.time)}" placeholder="Dauer in Std.">
      ${opts.showCategory && cat ? `<div class="r-cat">${esc(cat.name)}</div>` : ""}
    </div>

    <div class="r-side">
      ${stamp}
      <div class="rowtools" data-tools="${e.id}">
        <button class="tool show" data-stage="${e.id}" tabindex="-1" title="Der Kundin zeigen">zeigen</button>
        <button class="tool word" data-copy="${e.id}" tabindex="-1" title="Zeile als Vorlage verdoppeln">Kopie</button>
        <button class="tool word" data-del="${e.id}" tabindex="-1" title="Zeile löschen">löschen</button>
      </div>
    </div>
  </div>`;
}

function wireHome(){
  app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    view = { screen:"category", categoryId: b.dataset.open };
    editingCat = null; ordnen = false;
    render(); scrollTop();
  });

  app.querySelectorAll("[data-editcat]").forEach(b => b.onclick = () => {
    editingCat = b.dataset.editcat;
    render();
    const f = app.querySelector(`[data-catname="${editingCat}"]`);
    if(f){ f.focus(); f.select(); }
  });

  const umschalter = document.getElementById("ordnenUm");
  if(umschalter) umschalter.onclick = () => {
    ordnen = !ordnen;
    editingCat = null;
    render();
  };

  app.querySelectorAll("[data-vor]").forEach(b =>
    b.onclick = handler(() => verschiebeKategorie(b.dataset.vor, -1)));
  app.querySelectorAll("[data-zurueck]").forEach(b =>
    b.onclick = handler(() => verschiebeKategorie(b.dataset.zurueck, +1)));

  app.querySelectorAll("[data-cancelcat]").forEach(b => b.onclick = () => {
    editingCat = null; render();
  });

  app.querySelectorAll("[data-savecat]").forEach(b => b.onclick = handler(() => saveCat(b.dataset.savecat)));
  app.querySelectorAll("[data-catname]").forEach(f => {
    f.onkeydown = ev => {
      if(ev.key === "Enter") handler(saveCat)(f.dataset.catname);
      if(ev.key === "Escape"){ editingCat = null; render(); }
    };
  });

  app.querySelectorAll("[data-delcat]").forEach(b => b.onclick = () => {
    const id = b.dataset.delcat, cat = catById(id), n = entriesOf(id).length;
    const box = b.closest(".cat-editor-row");
    box.innerHTML = `<div class="confirm">
        <span>„${esc(cat.name)}“${n ? ` mit ${plural(n, "Eintrag", "Einträgen")}` : ""} löschen?</span>
        <button class="yes">Ja, löschen</button><button class="no">Abbrechen</button>
      </div>`;
    box.querySelector(".no").onclick = () => render();
    box.querySelector(".yes").onclick = handler(async () => {
      const betroffen = entriesOf(id);
      await schreibe("Kategorie löschen", () => sb.from("categories").delete().eq("id", id));
      await bilderWegraeumen(betroffen);
      data.categories = data.categories.filter(c => c.id !== id);
      data.entries    = data.entries.filter(e => e.categoryId !== id);   // die Datenbank löscht mit
      editingCat = null; render(); zeigeStand();
      melde("Kategorie gelöscht");
    });
  });

  const newCat = document.getElementById("newCat");
  const add = handler(async () => {
    const name = newCat.value.trim();
    if(!name) return;
    newCat.value = "";
    const position = data.categories.length
      ? Math.max(...data.categories.map(c => c.position ?? 0)) + 1 : 0;
    const reihe = await schreibe("Kategorie anlegen", () =>
      sb.from("categories").insert({ name, position }).select().single());
    data.categories.push({ id: reihe.id, name: reihe.name, position: reihe.position });
    render(); zeigeStand();
    const again = document.getElementById("newCat");
    if(again) again.focus();
  });
  document.getElementById("addCat").onclick = add;
  newCat.onkeydown = ev => { if(ev.key === "Enter") add(); };
}

// Nach dem Tausch wird durchnummeriert und nur geschrieben, was sich
// wirklich geändert hat. Das räumt nebenbei doppelte oder lückenhafte
// Positionen auf, die ein Import hinterlassen haben könnte.
async function verschiebeKategorie(id, richtung){
  const liste = data.categories.slice();
  const i = liste.findIndex(c => c.id === id);
  const j = i + richtung;
  if(i < 0 || j < 0 || j >= liste.length) return;

  const merk = liste[i]; liste[i] = liste[j]; liste[j] = merk;

  const geaendert = [];
  liste.forEach((c, platz) => { if(c.position !== platz){ c.position = platz; geaendert.push(c); } });
  for(const c of geaendert){
    await schreibe("Reihenfolge ändern", () =>
      sb.from("categories").update({ position: c.position }).eq("id", c.id));
  }

  data.categories = liste;
  render();
}

async function saveCat(id){
  const field = app.querySelector(`[data-catname="${id}"]`);
  const name = field ? field.value.trim() : "";
  const cat = catById(id);
  if(cat && name && name !== cat.name){
    await schreibe("Umbenennen", () => sb.from("categories").update({ name }).eq("id", id));
    cat.name = name;
  }
  editingCat = null;
  render();
}

    data.entries.push(ausDb(reihe));
    render(); zeigeStand();
    const field = app.querySelector(`.f-name[data-id="${reihe.id}"]`);
    if(field){ field.focus(); field.scrollIntoView({ block:"center", behavior:"smooth" }); }
  });
  wireRows();
}

/* ============================================================
   Suche — Treffer sind gewöhnliche, editierbare Zeilen
   ============================================================ */
function renderSearch(){
  const q = query.toLowerCase();
  const direct = data.entries.filter(e =>
    (e.name || "").toLowerCase().includes(q) ||
    (e.note || "").toLowerCase().includes(q) ||
    (e.time || "").toLowerCase().includes(q));
  const byCat = data.categories
    .filter(c => c.name.toLowerCase().includes(q))
    .flatMap(c => entriesOf(c.id));

  const seen = new Set(), hits = [];
  [...direct, ...byCat].forEach(e => { if(!seen.has(e.id)){ seen.add(e.id); hits.push(e); } });

  app.innerHTML = hits.length
    ? `<section class="section">
         <div class="section-head">
           <h2>Treffer</h2>
           <span class="count">${plural(hits.length, "Zeile", "Zeilen")}</span>
         </div>
         <div class="rows">${hits.map(e => rowHTML(e, { showCategory:true })).join("")}</div>
       </section>`
    : `<div class="blank">Nichts gefunden für „${esc(query)}“.</div>`;

  wireRows();
}

/* ============================================================
   Zeilen verdrahten
   ============================================================ */
function wireRows(){
  app.querySelectorAll(".f").forEach(f => {
    f.addEventListener("change", commitField);
    f.addEventListener("blur", commitField);
    f.addEventListener("focus", () => markUsed(f.dataset.id));
    f.addEventListener("keydown", ev => {
      if(ev.key === "Enter"){ ev.preventDefault(); f.blur(); }
      if(ev.key === "Escape") f.blur();
    });
  });

  app.querySelectorAll("[data-pick]").forEach(inp => inp.addEventListener("change", ev => {
    const datei = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    const e = entryById(inp.dataset.pick);
    if(datei && e) bildHochladen(e, datei);
  }));

  app.querySelectorAll("[data-unimg]").forEach(b => b.onclick = handler(() => {
    const e = entryById(b.dataset.unimg);
    return e ? bildEntfernen(e) : null;
  }));

  app.querySelectorAll("[data-big]").forEach(b => b.onclick = () => {
    const e = entryById(b.dataset.big);
    if(e && e.imageUrl){ markUsed(e.id); openLightbox(e.imageUrl); }
  });

  app.querySelectorAll("[data-stage]").forEach(b => b.onclick = () => openStage(b.dataset.stage));

  app.querySelectorAll("[data-copy]").forEach(b => b.onclick = handler(async () => {
    const e = entryById(b.dataset.copy);
    if(!e) return;
    const reihe = await schreibe("Verdoppeln", () => sb.from("entries").insert({
      category_id: e.categoryId,
      name: e.name ? e.name + " (Kopie)" : "",
      price: e.price, note: e.note, duration: e.time,
      position: (e.position ?? 0) + 1
      // image_path bleibt leer: zwei Zeilen sollen sich keine Datei teilen,
      // sonst löscht das Entfernen bei der einen das Bild der anderen mit.
    }).select().single());
    data.entries.splice(data.entries.indexOf(e) + 1, 0, ausDb(reihe));
    render(); zeigeStand();
    const field = app.querySelector(`.f-name[data-id="${reihe.id}"]`);
    if(field){ field.focus(); field.select(); }
  }));

  // Löschen mit Rückfrage direkt in der Zeile — kein extra Fenster
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const id = b.dataset.del, e = entryById(id);
    if(!e) return;
    const tools = app.querySelector(`[data-tools="${id}"]`);
    const restore = tools.innerHTML;
    tools.innerHTML = `<div class="confirm">
        <span>Löschen?</span>
        <button class="yes">Ja</button><button class="no">Nein</button>
      </div>`;
    tools.querySelector(".no").onclick = () => { tools.innerHTML = restore; wireRows(); };
    tools.querySelector(".yes").onclick = handler(async () => {
      await schreibe("Löschen", () => sb.from("entries").delete().eq("id", id));
      await bilderWegraeumen([e]);
      data.entries = data.entries.filter(x => x.id !== id);
      render(); zeigeStand();
      melde("Zeile gelöscht");
    });
  });
}

async function commitField(ev){
  const f = ev.target;
  const e = entryById(f.dataset.id);
  if(!e) return;
  const key = f.dataset.f;
  let patch = null;

  if(key === "price"){
    const raw = f.value.trim();
    let neu;
    if(!raw){
      neu = null;
    }else{
      const n = toNumber(raw);
      if(n == null){                       // unlesbar → alten Wert zurückschreiben
        f.value = e.price != null ? money(e.price) : "";
        return;
      }
      neu = n;
    }
    f.value = neu != null ? money(neu) : "";
    if(neu === e.price) return;
    patch = { price: neu };

  }else if(key === "time"){
    const val = normalizeDuration(f.value);   // "1,5" → "1 Std. 30 Min."
    f.value = val;
    if(e.time === val) return;
    patch = { duration: val };

  }else{
    const val = f.value.trim();
    if(e[key] === val) return;
    patch = { [key]: val };
  }

  // Das Preisdatum vergibt die Datenbank per Trigger. Deshalb die
  // geschriebene Zeile zurücklesen, statt hier ein Datum zu erfinden.
  try{
    const reihe = await schreibe("Speichern", () =>
      sb.from("entries").update(patch).eq("id", e.id).select().single());
    Object.assign(e, ausDb(reihe));
    refreshStamp(e);
  }catch(_){ /* bereits gemeldet; der Wert bleibt im Feld stehen */ }
}

// nur die Datumszeile auffrischen — kein Neuaufbau, der Fokus geht nicht verloren
function refreshStamp(e){
  app.querySelectorAll(`.row[data-row="${e.id}"] .r-side > .stamp`).forEach(el => {
    const old = ageInDays(e.priceDate) > OLD_DAYS;
    el.className = "stamp" + (old ? " old" : "");
    el.innerHTML = e.priceDate
      ? `Preis vom ${dateShort(e.priceDate)}${old ? " &middot; prüfen?" : ""}`
      : "noch kein Preis eingetragen";
  });
}

/* ============================================================
   Kundenansicht — groß, ruhig, ohne Bedienelemente
   ============================================================ */
function openStage(id){
  const e = entryById(id);
  if(!e) return;
  markUsed(id);

  const box = document.createElement("div");
  box.className = "stage";
  box.innerHTML = `
    <button class="s-close" title="Schließen">&times;</button>
    ${e.imageUrl ? `<img src="${e.imageUrl}" alt="">` : ""}
    <div class="s-name">${esc(e.name || "")}</div>
    <div class="s-price">${e.price != null ? money(e.price) + "&nbsp;&euro;" : "&mdash;"}</div>
    ${e.note ? `<div class="s-note">${esc(e.note)}</div>` : ""}
    ${e.time ? `<div class="s-time">Dauer: ${esc(e.time)}</div>` : ""}
    <div class="s-hint">Tippen zum Schließen</div>`;

  const close = () => { box.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = ev => { if(ev.key === "Escape") close(); };
  box.onclick = close;
  document.addEventListener("keydown", onKey);
  document.body.appendChild(box);
}

function openLightbox(src){
  const box = document.createElement("div");
  box.className = "lightbox";
  box.innerHTML = `<button title="Schließen">&times;</button><img src="${src}" alt="">`;
  const close = () => { box.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = ev => { if(ev.key === "Escape") close(); };
  box.onclick = close;
  document.addEventListener("keydown", onKey);
  document.body.appendChild(box);
}

/* ============================================================
   Suche oben
   ============================================================ */
const searchField = document.getElementById("search");
const searchBar = document.querySelector(".searchbar");

searchField.addEventListener("input", () => {
  query = searchField.value.trim();
  searchBar.classList.toggle("searching", query !== "");
  render();
});
searchField.addEventListener("keydown", ev => {

});
document.getElementById("searchClear").onclick = clearSearch;

function clearSearch(){

  searchField.value = "";
  searchBar.classList.remove("searching");

  searchField.focus();
}

/* ============================================================
   Export / Import
   ============================================================ */
document.getElementById("exportBtn").onclick = () => {
  const inhalt = {
    exportiert_am: new Date().toISOString(),
    categories: data.categories.map(c => ({ id:c.id, name:c.name, position:c.position })),
    entries: data.entries.map(e => ({
      id:e.id, categoryId:e.categoryId, name:e.name, price:e.price,
      priceDate:e.priceDate, note:e.note, time:e.time, position:e.position
    }))
  };
  const name = `preisliste-${new Date().toISOString().slice(0,10)}.json`;
  const url = URL.createObjectURL(new Blob([JSON.stringify(inhalt, null, 2)], { type:"application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  zeigeStand(`Gesichert als ${name}.`);
};

document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();

document.getElementById("importFile").addEventListener("change", ev => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if(!file) return;

  const reader = new FileReader();
  reader.onload = res => {
    let incoming;
    try{
      incoming = JSON.parse(res.target.result);
      if(!Array.isArray(incoming.categories) || !Array.isArray(incoming.entries))
        throw new Error("Die Datei enthält keine Preisliste.");
    }catch(err){
      return zeigeStand("Import fehlgeschlagen: " + err.message);
    }
    frageImportArt(incoming);
  };
  reader.readAsText(file);
});

// Rückfrage inline im Datenfeld statt als Systemdialog
function frageImportArt(incoming){
  const note = document.getElementById("dataNote");
  note.innerHTML = `<div class="confirm" style="color:var(--ink);justify-content:flex-start">
      <span><b>${incoming.entries.length}</b> ${incoming.entries.length === 1 ? "Zeile" : "Zeilen"} gefunden. Wie einfügen?</span>
    </div>
    <div class="data-row" style="margin-top:10px">
      <button class="btn ghost" id="impMerge">Dazunehmen</button>
      <button class="btn warn" id="impReplace">Alles ersetzen</button>
      <button class="btn ghost" id="impCancel">Abbrechen</button>
    </div>`;

  document.getElementById("impCancel").onclick = () => zeigeStand("Import abgebrochen.");
  document.getElementById("impReplace").onclick = () => importiere(incoming, true);
  document.getElementById("impMerge").onclick   = () => importiere(incoming, false);
}

async function importiere(incoming, ersetzen){
  try{
    zeigeStand("Import läuft…");

    if(ersetzen){
      // Kategorien löschen nimmt ihre Zeilen mit (Fremdschlüssel mit Kaskade)
      const alte = data.categories.map(c => c.id);
      if(alte.length){
        await schreibe("Leeren", () => sb.from("categories").delete().in("id", alte));
      }
      data.categories = []; data.entries = [];
    }

    // Kategorien anlegen bzw. bestehende nach Namen wiederverwenden
    const zuordnung = {};
    for(const c of incoming.categories){
      const gleich = data.categories.find(x => x.name.toLowerCase() === String(c.name).toLowerCase());
      if(gleich){ zuordnung[c.id] = gleich.id; continue; }
      const position = data.categories.length
        ? Math.max(...data.categories.map(x => x.position ?? 0)) + 1 : 0;
      const reihe = await schreibe("Kategorie anlegen", () =>
        sb.from("categories").insert({ name: String(c.name), position }).select().single());
      data.categories.push({ id: reihe.id, name: reihe.name, position: reihe.position });
      zuordnung[c.id] = reihe.id;
    }

    // Zeilen in einem Rutsch. Das Preisdatum aus der Datei wird
    // mitgenommen, damit der Goldpreis-Hinweis nicht zurückgesetzt wird.
    const neue = incoming.entries
      .map((e, i) => ({
        category_id: zuordnung[e.categoryId],
        name: String(e.name ?? ""),
        price: e.price == null ? null : Number(e.price),
        note: String(e.note ?? ""),
        duration: normalizeDuration(e.time ?? ""),
        position: Number.isFinite(e.position) ? e.position : i
      }))
      .filter(r => r.category_id);

    if(neue.length){
      const reihen = await schreibe("Zeilen einfügen", () =>
        sb.from("entries").insert(neue).select());
      reihen.forEach(r => data.entries.push(ausDb(r)));

      // Der Trigger hat eben "jetzt" gestempelt. Wo die Datei ein älteres
      // Datum mitbringt, wird es nachgetragen — sonst sähe jeder importierte
      // Preis frisch aus, obwohl er alt ist.
      const nachtrag = reihen
        .map((r, i) => ({ id: r.id, datum: incoming.entries[i] && incoming.entries[i].priceDate }))
        .filter(x => x.datum);
      for(const x of nachtrag){
        await sb.from("entries").update({ price_date: x.datum }).eq("id", x.id);
        const e = entryById(x.id);
        if(e) e.priceDate = x.datum;
      }
    }

    view = { screen:"home", categoryId:null };
    render();
    zeigeStand(ersetzen
      ? `Ersetzt — ${plural(data.entries.length, "Zeile", "Zeilen")} übernommen.`
      : `Dazugenommen — ${plural(neue.length, "Zeile", "Zeilen")} ergänzt.`);
  }catch(err){
    zeigeStand("Import abgebrochen, siehe Meldung oben.");
  }
}

/* ============================================================
   Hinweiszeile unter den Datenknöpfen
   ============================================================ */
function zeigeStand(nachricht){
  const note = document.getElementById("dataNote");
  const n = data.entries.length;
  note.innerHTML =
    (nachricht ? `<b>${esc(nachricht)}</b><br>` : "") +
    `Gespeichert bei Supabase — <b>${n}</b> ${n === 1 ? "Zeile" : "Zeilen"} in ` +
    `<b>${plural(data.categories.length, "Kategorie", "Kategorien")}</b>. ` +
    `Änderungen sind sofort auf allen Geräten sichtbar. ` +
    `Ein Export bleibt trotzdem sinnvoll, falls einmal etwas versehentlich gelöscht wird.`;
}

/* ============================================================
   Zeichnen
   ============================================================ */
function render(){
  if(query) renderSearch();
  else if(view.screen === "category") renderCategory(view.categoryId);
  else renderHome();
}
const scrollTop = () => window.scrollTo({ top:0, behavior:"smooth" });

/* ============================================================
   Anmeldung
   ============================================================ */
const gate       = document.getElementById("gate");
const hauptteil  = document.getElementById("hauptbereich");
const passwort   = document.getElementById("passwort");
const gateFehler = document.getElementById("gateFehler");

function zeigeAnmeldung(){
  gate.hidden = false;
  hauptteil.hidden = true;
  passwort.value = "";
  setTimeout(() => passwort.focus(), 50);
}

async function zeigeListe(){
  gate.hidden = true;
  hauptteil.hidden = false;
  app.innerHTML = `<div class="laedt">Preisliste wird geladen&hellip;</div>`;
  try{
    await ladeAlles();
    render();
    zeigeStand();
  }catch(err){
    console.error(err);
    app.innerHTML = `<div class="blank">
        Die Preisliste konnte nicht geladen werden.<br>
        <span style="font-size:.85rem">${esc(err.message || err)}</span><br><br>
        <button class="btn" id="nochmal">Nochmal versuchen</button>
      </div>`;
    const knopf = document.getElementById("nochmal");
    if(knopf) knopf.onclick = () => zeigeListe();
  }
}

async function anmelden(){
  const pw = passwort.value;
  if(!pw){ gateFehler.textContent = "Bitte das Passwort eingeben."; return; }
  gateFehler.textContent = "";
  const knopf = document.getElementById("anmelden");
  knopf.disabled = true; knopf.textContent = "Einen Moment…";
  const { error } = await sb.auth.signInWithPassword({ email: KONTO, password: pw });
  knopf.disabled = false; knopf.textContent = "Öffnen";
  if(error){
    gateFehler.textContent = /invalid/i.test(error.message)
      ? "Das Passwort stimmt nicht."
      : "Anmeldung fehlgeschlagen: " + error.message;
    passwort.select();
    return;
  }
  zeigeListe();
}

document.getElementById("anmelden").onclick = anmelden;
passwort.onkeydown = ev => { if(ev.key === "Enter") anmelden(); };

document.getElementById("abmelden").onclick = async () => {
  await sb.auth.signOut();
  data = { categories: [], entries: [] };
  view = { screen:"home", categoryId:null };
  query = ""; searchField.value = "";
  searchBar.classList.remove("searching");
  zeigeAnmeldung();
};

// Beim Start: bestehende Sitzung weiterverwenden, sonst nach dem Passwort
// fragen. Am Tresen bleibt das Gerät damit angemeldet.
(async () => {
  const { data: sitzung } = await sb.auth.getSession();
  if(sitzung && sitzung.session) zeigeListe();
  else zeigeAnmeldung();
})();

})();
