<meta name="theme-color" content="#f7f5f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Preisliste">
<style>
  :root{
    --bg:#f7f5f0;
    --paper:#fffefb;
    --line:#e8e2d6;
    --line-firm:#d3cab6;
    --ink:#2a2520;
    --ink-soft:#857c6d;
    --gold:#8b6f47;
    --gold-deep:#6a5334;
    --gold-wash:#f1e9da;
    --warn:#9c4a2f;
    --r:16px;
    --tap:52px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font:400 18px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding-bottom:40px;
  }
  input,button,select{font:inherit;color:inherit;}
  button{cursor:pointer;background:none;border:none;padding:0;}

  .wrap{max-width:940px;margin:0 auto;padding:0 16px 16px;}

  /* ---------- Kopf ---------- */
  .masthead{padding:20px 0 10px;text-align:center;}
  .masthead h1{
    margin:0;font-size:1.25rem;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--gold-deep);
  }
  .masthead p{margin:5px 0 0;font-size:.82rem;color:var(--ink-soft);letter-spacing:.03em;}

  /* ---------- Suche ---------- */
  .searchbar{position:sticky;top:0;z-index:30;background:var(--bg);padding:8px 0 14px;}
  .searchbar-inner{position:relative;}
  #search{
    width:100%;height:var(--tap);
    padding:0 46px 0 20px;
    font-size:1.1rem;
    background:var(--paper);
    border:1.5px solid var(--line-firm);
    border-radius:var(--r);
  }
  #search::placeholder{color:var(--ink-soft);}
  #search:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-wash);}
  .search-clear{
    position:absolute;right:6px;top:6px;
    width:40px;height:40px;border-radius:10px;
    font-size:1.3rem;color:var(--ink-soft);display:none;
  }
  .search-clear:hover{background:var(--gold-wash);color:var(--gold-deep);}
  .searching .search-clear{display:block;}

  /* ---------- Abschnitte ---------- */
  .section{margin-bottom:30px;}
  .section-head{
    display:flex;align-items:baseline;gap:10px;margin:0 2px 12px;
  }
  .section-head h2{
    margin:0;font-size:.8rem;font-weight:700;letter-spacing:.11em;
    text-transform:uppercase;color:var(--ink-soft);
  }
  .section-head .count{font-size:.8rem;color:var(--ink-soft);}

  /* ---------- Kategorie-Kacheln ---------- */
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
  .cat{
    position:relative;background:var(--paper);border:1.5px solid var(--line);
    border-radius:var(--r);overflow:hidden;
  }
  .cat-open{
    display:block;width:100%;text-align:left;
    padding:20px 52px 20px 20px;min-height:92px;
  }
  .cat-open:hover{background:var(--gold-wash);}
  .cat-name{display:block;font-size:1.2rem;font-weight:600;line-height:1.25;}
  .cat-sub{display:block;margin-top:5px;font-size:.82rem;color:var(--ink-soft);}
  .cat-edit{
    position:absolute;top:8px;right:8px;
    width:40px;height:40px;border-radius:10px;
    font-size:1rem;color:var(--ink-soft);
  }
  .cat-edit:hover{background:var(--gold-wash);color:var(--gold-deep);}
  .cat.editing .cat-open,.cat.editing .cat-edit{display:none;}
  .cat-editor{padding:14px;display:none;}
  .cat.editing .cat-editor{display:block;}
  .cat-editor input{
    width:100%;height:46px;padding:0 12px;margin-bottom:10px;
    background:#fff;border:1.5px solid var(--line-firm);border-radius:10px;font-size:1.05rem;
  }
  .cat-editor input:focus{outline:none;border-color:var(--gold);}
  .cat-editor-row{display:flex;gap:8px;flex-wrap:wrap;}

  .cat-add{display:flex;gap:10px;margin-top:14px;}
  .cat-add input{
    flex:1;height:var(--tap);padding:0 18px;
    background:var(--paper);border:1.5px dashed var(--line-firm);
    border-radius:var(--r);font-size:1.02rem;
  }
  .cat-add input:focus{outline:none;border-style:solid;border-color:var(--gold);}

  /* ---------- Knöpfe ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    min-height:46px;padding:0 20px;border-radius:12px;
    font-size:.98rem;font-weight:600;
    background:var(--gold);color:#fff;
  }
  .btn:hover{background:var(--gold-deep);}
  .btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line-firm);}
  .btn.ghost:hover{background:var(--gold-wash);border-color:var(--gold);}
  .btn.warn{background:var(--warn);color:#fff;}
  .btn.warn:hover{background:#823a23;}

  /* ---------- Zeilen ---------- */
  .rows{display:flex;flex-direction:column;gap:12px;}
  /* Die Tab-Reihenfolge folgt dem DOM: Bezeichnung, Preis, Notiz, Dauer.
     Die Darstellung wird davon über feste Grid-Plätze entkoppelt,
     damit der Preis rechts steht, aber als zweites angesprungen wird. */
  .row{
    background:var(--paper);border:1.5px solid var(--line);
    border-radius:var(--r);padding:14px;
    display:grid;
    grid-template-columns:minmax(0,1fr) 208px;
    grid-template-rows:auto auto;
    column-gap:16px;row-gap:8px;align-items:start;
    transition:border-color .18s,background-color .5s;
  }
  .row > .r-name     {grid-column:1;grid-row:1;align-self:center;}
  .row > .price-field{grid-column:2;grid-row:1;align-self:center;}
  .row > .r-meta     {grid-column:1;grid-row:2;}
  .row > .r-side     {grid-column:2;grid-row:2;}
  .row:focus-within{border-color:var(--gold);}
  .row.flash{background:var(--gold-wash);}

  /* Textfelder */
  .f{
    width:100%;background:transparent;border:1.5px solid transparent;
    border-radius:9px;padding:7px 9px;
  }
  .f:hover{border-color:var(--line);}
  .f:focus{outline:none;background:#fff;border-color:var(--gold);}
  .f-name{font-size:1.16rem;font-weight:600;}
  .f-name::placeholder{font-weight:400;}
  .r-meta{display:flex;gap:8px;flex-wrap:wrap;min-width:0;}
  /* min-width:0 — sonst hält jedes Eingabefeld seine Eigenbreite
     von rund 20 Zeichen und Notiz/Dauer brechen unnötig um. */
  .r-meta .f{flex:1 1 140px;width:auto;min-width:0;font-size:.94rem;color:var(--ink-soft);}
  .f-note:focus,.f-time:focus{color:var(--ink);}
  .r-cat{flex:1 1 100%;font-size:.76rem;color:var(--ink-soft);padding:0 9px;}
  ::placeholder{color:#b3aa99;}

  /* Preisspalte */
  .r-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .price-field{position:relative;width:100%;}
  .price-field .f-price{
    width:100%;text-align:right;
    padding:6px 34px 6px 9px;
    font-size:1.7rem;font-weight:600;line-height:1.2;
    letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  }
  .price-field .cur{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font-size:1.25rem;color:var(--ink-soft);pointer-events:none;
  }
  .stamp{font-size:.76rem;color:var(--ink-soft);text-align:right;padding-right:2px;}
  .stamp.old{color:var(--warn);font-weight:600;}
  .rowtools{display:flex;gap:2px;justify-content:flex-end;margin-top:2px;}
  .tool{
    width:40px;height:40px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:.95rem;color:var(--ink-soft);
  }
  .tool:hover{background:var(--gold-wash);color:var(--gold-deep);}
  .tool.show{width:auto;padding:0 15px;font-size:.85rem;font-weight:600;color:var(--gold-deep);background:var(--gold-wash);}
  .tool.show:hover{background:var(--gold);color:#fff;}
  /* Wörter statt Zeichen — am Tresen soll nichts gedeutet werden müssen */
  .tool.word{width:auto;padding:0 10px;font-size:.8rem;}
  .tool.word[data-del]:hover{background:#f6e7e2;color:var(--warn);}
  .confirm{
    display:flex;gap:8px;align-items:center;justify-content:flex-end;
    flex-wrap:wrap;font-size:.85rem;color:var(--warn);
  }
  .confirm button{padding:8px 12px;border-radius:8px;font-size:.85rem;font-weight:600;}
  .confirm .yes{background:var(--warn);color:#fff;}
  .confirm .no{background:var(--line);color:var(--ink);}

  .row-add{
    width:100%;min-height:var(--tap);margin-top:14px;
    border:2px dashed var(--line-firm);border-radius:var(--r);
    color:var(--gold-deep);font-size:1.04rem;font-weight:600;
  }
  .row-add:hover{background:var(--gold-wash);border-color:var(--gold);}

  /* ---------- Kategorie-Ansicht ---------- */
  .cathead{display:flex;align-items:center;gap:6px;margin-bottom:18px;}
  .cathead h2{margin:0;font-size:1.35rem;font-weight:600;flex:1;min-width:0;}
  .back{width:var(--tap);height:var(--tap);border-radius:12px;font-size:1.3rem;color:var(--gold-deep);flex-shrink:0;}
  .back:hover{background:var(--gold-wash);}

  .blank{text-align:center;color:var(--ink-soft);padding:34px 16px;font-size:.98rem;}

  /* ---------- Kundenansicht ---------- */
  .stage{
    position:fixed;inset:0;z-index:80;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px;text-align:center;overflow:auto;
  }
  .stage img{
    max-width:min(340px,70vw);max-height:34vh;
    border-radius:14px;margin-bottom:26px;object-fit:contain;
  }
  .stage .s-name{
    font-size:clamp(1.5rem,4.5vw,2.3rem);font-weight:600;
    line-height:1.2;max-width:16ch;margin-bottom:18px;
  }
  .stage .s-price{
    font-size:clamp(3.6rem,15vw,7rem);font-weight:600;
    line-height:1;letter-spacing:-.02em;color:var(--gold-deep);
    font-variant-numeric:tabular-nums;
  }
  .stage .s-note{
    margin-top:20px;font-size:clamp(1rem,2.6vw,1.25rem);color:var(--ink-soft);max-width:22ch;
  }
  .stage .s-time{margin-top:8px;font-size:.98rem;color:var(--ink-soft);}
  .stage .s-close{
    position:absolute;top:18px;right:18px;
    width:var(--tap);height:var(--tap);border-radius:12px;
    font-size:1.5rem;color:var(--ink-soft);
  }
  .stage .s-close:hover{background:var(--gold-wash);}
  .stage .s-hint{position:absolute;bottom:20px;font-size:.78rem;color:#bdb4a2;}

  /* ---------- Daten ---------- */
  .data{
    margin-top:34px;padding:20px;
    background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);
  }
  .data h2{margin:0 0 14px;font-size:.8rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);}
  .data-row{display:flex;gap:10px;flex-wrap:wrap;}
  .data-note{margin-top:14px;font-size:.83rem;color:var(--ink-soft);line-height:1.5;}
  .data-note b{color:var(--ink);font-weight:600;}

  @media (max-width:720px){
    body{font-size:17px;}
    /* Schmal: alles untereinander — Bezeichnung, Preis, Notiz/Dauer,
       zuletzt Datum und Knöpfe. Keine "auto"-Spalte für den Preis:
       ein Eingabefeld zieht sonst seine Eigenbreite von rund
       20 Zeichen und drückt die Bezeichnung weg. */
    .row{
      grid-template-columns:minmax(0,1fr);
      grid-template-rows:auto auto auto auto;
      row-gap:6px;
    }
    .row > .r-name     {grid-column:1;grid-row:1;}
    .row > .price-field{grid-column:1;grid-row:2;}
    .row > .r-meta     {grid-column:1;grid-row:3;}
    .row > .r-side     {grid-column:1;grid-row:4;align-items:stretch;}
    .price-field .f-price{font-size:1.8rem;}
    .stamp{text-align:left;}
    .rowtools{justify-content:flex-start;}
    .confirm{justify-content:flex-start;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <h1>Preisliste</h1>
    <p>Nachschlagen &middot; anpassen &middot; zeigen</p>
  </div>

  <div class="searchbar">
    <div class="searchbar-inner">
      <input type="text" id="search" placeholder="Suchen &ndash; Bezeichnung, Notiz, Kategorie" autocomplete="off" spellcheck="false">
      <button class="search-clear" id="searchClear" tabindex="-1" title="Suche leeren">&times;</button>
    </div>
  </div>

  <main id="app"></main>

  <section class="data">
    <h2>Daten sichern</h2>
    <div class="data-row">
      <button class="btn ghost" id="exportBtn">Export als JSON</button>
      <button class="btn ghost" id="importBtn">Import aus JSON</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <div class="data-note" id="dataNote"></div>
  </section>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   Speicher
   ============================================================ */
const KEY = "goldschmiede_preisliste_v1";
const RECENT_MAX = 6;
const OLD_DAYS = 180;         // ab hier Hinweis: Goldpreis prüfen?
const WORK_DAY_HOURS = 8;     // "2 Tage" -> 16 Std.

const uid = () => "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 9);

function freshData(){
  return {
    categories: ["Löten","Reparatur","Anfertigung","Umarbeitung"].map(n => ({ id: uid(), name: n })),
    entries: [],
    recent: []
  };
}

// Bilder wurden entfernt, weil sie als base64 den knappen localStorage füllten.
// Altbestände werden beim Laden und beim Import weggeworfen — sonst bliebe
// der Platz belegt, obwohl nichts mehr davon angezeigt wird.
let droppedImages = 0;
function stripImages(entries){
  entries.forEach(e => {
    if(e && e.image != null){ delete e.image; droppedImages++; }
  });
  return entries;
}

function loadData(){
  let d;
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return freshData();
    d = JSON.parse(raw);
    if(!Array.isArray(d.categories) || !Array.isArray(d.entries)) return freshData();
    if(!Array.isArray(d.recent)) d.recent = [];
  }catch(err){
    console.error("Daten konnten nicht gelesen werden:", err);
    return freshData();
  }

  // Umschreiben getrennt absichern: eine gelesene Liste darf niemals
  // wegen eines Fehlers in der Umstellung verlorengehen.
  try{
    stripImages(d.entries);
    d.entries.forEach(e => { if(e && e.time) e.time = normalizeDuration(e.time); });
  }catch(err){
    console.error("Umstellung übersprungen:", err);
  }
  return d;
}

let data = loadData();

let writeTimer = null;
function save(){
  clearTimeout(writeTimer);
  writeTimer = setTimeout(writeThrough, 150);
}
function writeThrough(){
  clearTimeout(writeTimer);
  try{
    localStorage.setItem(KEY, JSON.stringify(data));
    showStorage();
  }catch(err){
    showStorage("Speichern fehlgeschlagen — der Speicher ist voll. " +
      "Bitte exportieren und nicht mehr benötigte Zeilen löschen.");
  }
}

/* ============================================================
   Kleine Helfer
   ============================================================ */

// Komma und Punkt gleichermaßen als Dezimaltrenner
function toNumber(input){
  if(input == null) return null;
  let s = String(input).trim().replace(/[^\d.,-]/g, "");
  if(!s) return null;
  const hasComma = s.includes(","), hasDot = s.includes(".");
  if(hasComma && hasDot){
    // der hintere Trenner ist der Dezimaltrenner
    s = s.lastIndexOf(",") > s.lastIndexOf(".")
      ? s.replace(/\./g, "").replace(",", ".")
      : s.replace(/,/g, "");
  }else if(hasComma){
    s = s.replace(",", ".");
  }else if(hasDot && /\.\d{3}\b/.test(s) && !/\.\d{1,2}$/.test(s)){
    s = s.replace(/\./g, "");   // 1.250 → 1250
  }
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : null;
}

const money = n => (n == null || !Number.isFinite(n))
  ? "" : n.toLocaleString("de-DE", { minimumFractionDigits:2, maximumFractionDigits:2 });

/* ---------- Dauer ----------
   Eingetragen wird, wie es am Tresen gesagt wird ("20 Min.", "1:30",
   "1 Std 30", "2 Tage"); angezeigt wird durchgehend in Stunden.
   Eine blanke Zahl gilt als Stunden — das Feld zeigt ja Stunden an,
   also meint eine Korrektur von "1,5 Std." auf "2" auch zwei Stunden. */
function parseDuration(input){
  if(input == null) return null;
  const s = String(input).trim().toLowerCase();
  if(!s) return null;

  // 1:30 als Stunden:Minuten. Nur der Doppelpunkt zählt hier — der Punkt
  // ist in dieser App durchgehend Dezimaltrenner (wie beim Preis), sonst
  // würde aus "1.25" still 1:25 statt 1,25 Stunden.
  const clock = s.match(/^(\d+)\s*:\s*([0-5]\d)\s*(?:h|std\.?|stunden?)?$/);
  if(clock) return Number(clock[1]) + Number(clock[2]) / 60;

  const factor = u => {
    if(/^(min|minute|minuten|m)$/.test(u)) return 1 / 60;
    if(/^(h|std|stunde|stunden|std\.)$/.test(u)) return 1;
    if(/^(t|tag|tage|d)$/.test(u)) return WORK_DAY_HOURS;
    return null;
  };

  let total = 0, found = false, lastWasHours = false;
  const token = /(\d+(?:[.,]\d+)?)\s*([a-zäöü.]*)/g;
  let m;
  while((m = token.exec(s)) !== null){
    const wert = parseFloat(m[1].replace(",", "."));
    if(!Number.isFinite(wert)) continue;
    const einheit = m[2].replace(/\.$/, "");
    let f = einheit ? factor(einheit) : null;
    if(einheit && f === null) return null;        // unbekannte Einheit → Text belassen
    if(f === null){
      // "1 Std 30" — die nachgestellte blanke Zahl sind Minuten,
      // eine allein stehende blanke Zahl sind Stunden.
      f = lastWasHours ? 1 / 60 : 1;
    }
    lastWasHours = f === 1;
    total += wert * f;
    found = true;
  }
  return found ? total : null;
}

function formatDuration(hours){
  if(hours == null || !Number.isFinite(hours)) return "";
  const gerundet = Math.round(hours * 100) / 100;
  return gerundet.toLocaleString("de-DE", { maximumFractionDigits: 2 }) + " Std.";
}

// Freitext in Stunden umschreiben; was sich nicht deuten lässt
// (etwa "nach Aufwand"), bleibt unverändert stehen.
function normalizeDuration(text){
  const h = parseDuration(text);
  return h === null ? String(text ?? "").trim() : formatDuration(h);
}

function dateShort(iso){
  const d = iso ? new Date(iso) : null;
  return (d && !isNaN(d)) ? d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}) : "";
}
function ageInDays(iso){
  const d = iso ? new Date(iso) : null;
  return (d && !isNaN(d)) ? (Date.now() - d.getTime()) / 864e5 : Infinity;
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

const catById   = id => data.categories.find(c => c.id === id);
const entryById = id => data.entries.find(e => e.id === id);
const entriesOf = id => data.entries.filter(e => e.categoryId === id);

function markUsed(id){
  if(!entryById(id)) return;
  data.recent = [id, ...data.recent.filter(r => r !== id)].slice(0, RECENT_MAX);
  save();
}

/* ============================================================
   Ansichtszustand
   ============================================================ */
let view = { screen:"home", categoryId:null };
let editingCat = null;     // Kategorie-ID, die gerade umbenannt wird
let query = "";

const app = document.getElementById("app");

/* ============================================================
   Zeilen-Markup
   ============================================================ */
function rowHTML(e, opts){
  opts = opts || {};
  const cat = catById(e.categoryId);
  const old = ageInDays(e.priceDate) > OLD_DAYS;
  const stamp = e.priceDate
    ? `<div class="stamp ${old ? "old" : ""}">Preis vom ${dateShort(e.priceDate)}${old ? " &middot; prüfen?" : ""}</div>`
    : `<div class="stamp">noch kein Preis eingetragen</div>`;

  // DOM-Reihenfolge = Tab-Reihenfolge: Bezeichnung, Preis, Notiz, Dauer.
  // Die Grid-Plätze in der CSS sorgen für die Optik, alle Knöpfe stehen auf tabindex="-1".
  return `
  <div class="row" data-row="${e.id}">
    <div class="r-name">
      <input class="f f-name" data-f="name" data-id="${e.id}" value="${esc(e.name)}" placeholder="Bezeichnung">
    </div>

    <div class="price-field">
      <input class="f f-price" data-f="price" data-id="${e.id}" inputmode="decimal"
             value="${e.price != null ? money(e.price) : ""}" placeholder="—">
      <span class="cur">&euro;</span>
    </div>

    <div class="r-meta">
      <input class="f f-note" data-f="note" data-id="${e.id}" value="${esc(e.note)}" placeholder="Notiz">
      <input class="f f-time" data-f="time" data-id="${e.id}" value="${esc(e.time)}" placeholder="Dauer in Std.">
      ${opts.showCategory && cat ? `<div class="r-cat">${esc(cat.name)}</div>` : ""}
    </div>

    <div class="r-side">
      ${stamp}
      <div class="rowtools" data-tools="${e.id}">
        <button class="tool show" data-stage="${e.id}" tabindex="-1" title="Der Kundin zeigen">zeigen</button>
        <button class="tool word" data-copy="${e.id}" tabindex="-1" title="Zeile als Vorlage verdoppeln">Kopie</button>
        <button class="tool word" data-del="${e.id}" tabindex="-1" title="Zeile löschen">löschen</button>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   Startseite
   ============================================================ */
function renderHome(){
  const recent = data.recent.map(entryById).filter(Boolean);

  let html = `<section class="section">
    <div class="section-head">
      <h2>Kategorien</h2>
      <span class="count">${plural(data.entries.length, "Eintrag", "Einträge")} insgesamt</span>
    </div>
    <div class="cats">${data.categories.map(catHTML).join("")}</div>
    <div class="cat-add">
      <input type="text" id="newCat" placeholder="Neue Kategorie&hellip;">
      <button class="btn" id="addCat">Anlegen</button>
    </div>
  </section>`;

  if(recent.length){
    html += `<section class="section">
      <div class="section-head"><h2>Zuletzt benutzt</h2></div>
      <div class="rows">${recent.map(e => rowHTML(e, { showCategory:true })).join("")}</div>
    </section>`;
  }

  app.innerHTML = html;
  wireHome();
  wireRows();
}

function catHTML(c){
  const n = entriesOf(c.id).length;
  return `
  <div class="cat ${editingCat === c.id ? "editing" : ""}" data-cat="${c.id}">
    <button class="cat-open" data-open="${c.id}">
      <span class="cat-name">${esc(c.name)}</span>
      <span class="cat-sub">${n === 0 ? "noch leer" : n === 1 ? "1 Eintrag" : n + " Einträge"}</span>
    </button>
    <button class="cat-edit" data-editcat="${c.id}" tabindex="-1" title="Umbenennen oder löschen">&#9998;</button>
    <div class="cat-editor">
      <input type="text" data-catname="${c.id}" value="${esc(c.name)}" placeholder="Name der Kategorie">
      <div class="cat-editor-row">
        <button class="btn" data-savecat="${c.id}">Sichern</button>
        <button class="btn ghost" data-cancelcat="1">Zurück</button>
        <button class="btn warn" data-delcat="${c.id}">Löschen</button>
      </div>
    </div>
  </div>`;
}

function wireHome(){
  app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    view = { screen:"category", categoryId:b.dataset.open };
    editingCat = null;
    render(); scrollTop();
  });

  app.querySelectorAll("[data-editcat]").forEach(b => b.onclick = () => {
    editingCat = b.dataset.editcat;
    render();
    const f = app.querySelector(`[data-catname="${editingCat}"]`);
    if(f){ f.focus(); f.select(); }
  });

  app.querySelectorAll("[data-cancelcat]").forEach(b => b.onclick = () => {
    editingCat = null; render();
  });

  app.querySelectorAll("[data-savecat]").forEach(b => b.onclick = () => saveCat(b.dataset.savecat));
  app.querySelectorAll("[data-catname]").forEach(f => {
    f.onkeydown = ev => {
      if(ev.key === "Enter") saveCat(f.dataset.catname);
      if(ev.key === "Escape"){ editingCat = null; render(); }
    };
  });

  app.querySelectorAll("[data-delcat]").forEach(b => b.onclick = () => {
    const id = b.dataset.delcat, cat = catById(id), n = entriesOf(id).length;
    const box = b.closest(".cat-editor-row");
    box.innerHTML = `<div class="confirm">
        <span>„${esc(cat.name)}“${n ? ` mit ${n} ${n === 1 ? "Eintrag" : "Einträgen"}` : ""} löschen?</span>
        <button class="yes">Ja, löschen</button><button class="no">Abbrechen</button>
      </div>`;
    box.querySelector(".no").onclick = () => render();
    box.querySelector(".yes").onclick = () => {
      data.categories = data.categories.filter(c => c.id !== id);
      data.entries    = data.entries.filter(e => e.categoryId !== id);
      data.recent     = data.recent.filter(r => entryById(r));
      editingCat = null; save(); render();
    };
  });

  const newCat = document.getElementById("newCat");
  const add = () => {
    const name = newCat.value.trim();
    if(!name) return;
    data.categories.push({ id: uid(), name });
    save(); render();
    const again = document.getElementById("newCat");
    if(again) again.focus();
  };
  document.getElementById("addCat").onclick = add;
  newCat.onkeydown = ev => { if(ev.key === "Enter") add(); };
}

function saveCat(id){
  const field = app.querySelector(`[data-catname="${id}"]`);
  const name = field ? field.value.trim() : "";
  const cat = catById(id);
  if(cat && name) cat.name = name;
  editingCat = null;
  save(); render();
}

/* ============================================================
   Kategorie-Ansicht
   ============================================================ */
function renderCategory(id){
  const cat = catById(id);
  if(!cat){ view = { screen:"home", categoryId:null }; return render(); }
  const list = entriesOf(id);

  app.innerHTML = `
    <div class="cathead">
      <button class="back" id="back" title="Zurück zur Übersicht">&#8592;</button>
      <h2>${esc(cat.name)}</h2>
    </div>
    <div class="rows">${
      list.length ? list.map(e => rowHTML(e)).join("")
                  : `<div class="blank">Noch nichts eingetragen.<br>Unten eine Zeile hinzufügen.</div>`
    }</div>
    <button class="row-add" id="addRow">+ &nbsp;Zeile hinzufügen</button>`;

  document.getElementById("back").onclick = () => {
    view = { screen:"home", categoryId:null }; render(); scrollTop();
  };
  document.getElementById("addRow").onclick = () => {
    const e = { id:uid(), categoryId:id, name:"", price:null, priceDate:null, note:"", time:"" };
    data.entries.push(e); save(); render();
    const field = app.querySelector(`.f-name[data-id="${e.id}"]`);
    if(field){ field.focus(); field.scrollIntoView({ block:"center", behavior:"smooth" }); }
  };
  wireRows();
}

/* ============================================================
   Suche — Treffer sind gewöhnliche, editierbare Zeilen
   ============================================================ */
function renderSearch(){
  const q = query.toLowerCase();
  const direct = data.entries.filter(e =>
    (e.name || "").toLowerCase().includes(q) ||
    (e.note || "").toLowerCase().includes(q) ||
    (e.time || "").toLowerCase().includes(q));
  const byCat = data.categories
    .filter(c => c.name.toLowerCase().includes(q))
    .flatMap(c => entriesOf(c.id));

  const seen = new Set(), hits = [];
  [...direct, ...byCat].forEach(e => { if(!seen.has(e.id)){ seen.add(e.id); hits.push(e); } });

  app.innerHTML = hits.length
    ? `<section class="section">
         <div class="section-head">
           <h2>Treffer</h2>
           <span class="count">${plural(hits.length, "Zeile", "Zeilen")}</span>
         </div>
         <div class="rows">${hits.map(e => rowHTML(e, { showCategory:true })).join("")}</div>
       </section>`
    : `<div class="blank">Nichts gefunden für „${esc(query)}“.</div>`;

  wireRows();
}

/* ============================================================
   Zeilen verdrahten
   ============================================================ */
function wireRows(){
  // Textfelder: bei Verlassen bzw. Änderung sichern
  app.querySelectorAll(".f").forEach(f => {
    f.addEventListener("change", commitField);
    f.addEventListener("blur", commitField);
    f.addEventListener("focus", () => markUsed(f.dataset.id));
    f.addEventListener("keydown", ev => {
      if(ev.key === "Enter"){ ev.preventDefault(); f.blur(); }
      if(ev.key === "Escape") f.blur();
    });
  });

  app.querySelectorAll("[data-stage]").forEach(b => b.onclick = () => openStage(b.dataset.stage));

  app.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const e = entryById(b.dataset.copy);
    if(!e) return;
    const copy = Object.assign({}, e, { id: uid(), name: e.name ? e.name + " (Kopie)" : "" });
    data.entries.splice(data.entries.indexOf(e) + 1, 0, copy);
    save(); render();
    const field = app.querySelector(`.f-name[data-id="${copy.id}"]`);
    if(field){ field.focus(); field.select(); }
  });

  // Löschen mit Rückfrage direkt in der Zeile — kein extra Fenster
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const id = b.dataset.del, e = entryById(id);
    if(!e) return;
    const tools = app.querySelector(`[data-tools="${id}"]`);
    const restore = tools.innerHTML;
    tools.innerHTML = `<div class="confirm">
        <span>Löschen?</span>
        <button class="yes">Ja</button><button class="no">Nein</button>
      </div>`;
    tools.querySelector(".no").onclick = () => { tools.innerHTML = restore; wireRows(); };
    tools.querySelector(".yes").onclick = () => {
      data.entries = data.entries.filter(x => x.id !== id);
      data.recent  = data.recent.filter(r => r !== id);
      save(); render();
    };
  });
}

function commitField(ev){
  const f = ev.target;
  const e = entryById(f.dataset.id);
  if(!e) return;
  const key = f.dataset.f;

  if(key === "price"){
    const raw = f.value.trim();
    if(!raw){
      e.price = null; e.priceDate = null;
    }else{
      const n = toNumber(raw);
      if(n == null){                       // unlesbar → alten Wert zurückschreiben
        f.value = e.price != null ? money(e.price) : "";
        return;
      }
      if(n !== e.price){                   // Datum nur bei echter Änderung neu setzen
        e.price = n;
        e.priceDate = new Date().toISOString();
      }
    }
    f.value = e.price != null ? money(e.price) : "";
    refreshStamp(e);
  }else if(key === "time"){
    const val = normalizeDuration(f.value);   // "90 Min." → "1,5 Std."
    f.value = val;
    if(e.time === val) return;
    e.time = val;
  }else{
    const val = f.value.trim();
    if(e[key] === val) return;
    e[key] = val;
  }
  save();
}

// nur die Datumszeile auffrischen — kein Neuaufbau, der Fokus geht nicht verloren
function refreshStamp(e){
  app.querySelectorAll(`.row[data-row="${e.id}"] .r-side > .stamp`).forEach(el => {
    const old = ageInDays(e.priceDate) > OLD_DAYS;
    el.className = "stamp" + (old ? " old" : "");
    el.innerHTML = e.priceDate
      ? `Preis vom ${dateShort(e.priceDate)}${old ? " &middot; prüfen?" : ""}`
      : "noch kein Preis eingetragen";
  });
}

/* ============================================================
   Kundenansicht — groß, ruhig, ohne Bedienelemente
   ============================================================ */
function openStage(id){
  const e = entryById(id);
  if(!e) return;
  markUsed(id);

  const box = document.createElement("div");
  box.className = "stage";
  box.innerHTML = `
    <button class="s-close" title="Schließen">&times;</button>
    <div class="s-name">${esc(e.name || "")}</div>
    <div class="s-price">${e.price != null ? money(e.price) + "&nbsp;&euro;" : "&mdash;"}</div>
    ${e.note ? `<div class="s-note">${esc(e.note)}</div>` : ""}
    ${e.time ? `<div class="s-time">Dauer: ${esc(e.time)}</div>` : ""}
    <div class="s-hint">Tippen zum Schließen</div>`;

  const close = () => { box.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = ev => { if(ev.key === "Escape") close(); };
  box.onclick = close;
  document.addEventListener("keydown", onKey);
  document.body.appendChild(box);
}

/* ============================================================
   Suche oben
   ============================================================ */
const searchField = document.getElementById("search");
const searchBar = document.querySelector(".searchbar");

searchField.addEventListener("input", () => {
  query = searchField.value.trim();
  searchBar.classList.toggle("searching", query !== "");
  render();
});
searchField.addEventListener("keydown", ev => {
  if(ev.key === "Escape") clearSearch();
});
document.getElementById("searchClear").onclick = clearSearch;

function clearSearch(){
  query = "";
  searchField.value = "";
  searchBar.classList.remove("searching");
  render();
  searchField.focus();
}

/* ============================================================
   Export / Import
   ============================================================ */
document.getElementById("exportBtn").onclick = () => {
  writeThrough();
  const name = `preisliste-${new Date().toISOString().slice(0,10)}.json`;
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type:"application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showStorage(`Gesichert als ${name}.`);
};

document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();

document.getElementById("importFile").addEventListener("change", ev => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if(!file) return;

  const reader = new FileReader();
  reader.onload = res => {
    let incoming;
    try{
      incoming = JSON.parse(res.target.result);
      if(!Array.isArray(incoming.categories) || !Array.isArray(incoming.entries))
        throw new Error("Die Datei enthält keine Preisliste.");
      // Ältere Sicherungen können noch Bilder enthalten — die bleiben draußen.
      stripImages(incoming.entries);
    }catch(err){
      return showStorage("Import fehlgeschlagen: " + err.message);
    }
    askImportMode(incoming);
  };
  reader.readAsText(file);
});

// Rückfrage inline im Datenfeld statt als Systemdialog
function askImportMode(incoming){
  const note = document.getElementById("dataNote");
  note.innerHTML = `<div class="confirm" style="color:var(--ink);justify-content:flex-start">
      <span><b>${incoming.entries.length}</b> ${incoming.entries.length === 1 ? "Zeile" : "Zeilen"} gefunden. Wie einfügen?</span>
    </div>
    <div class="data-row" style="margin-top:10px">
      <button class="btn ghost" id="impMerge">Dazunehmen</button>
      <button class="btn warn" id="impReplace">Alles ersetzen</button>
      <button class="btn ghost" id="impCancel">Abbrechen</button>
    </div>`;

  document.getElementById("impCancel").onclick = () => showStorage("Import abgebrochen.");

  document.getElementById("impReplace").onclick = () => {
    data = {
      categories: incoming.categories,
      entries: incoming.entries,
      recent: Array.isArray(incoming.recent) ? incoming.recent : []
    };
    writeThrough();
    view = { screen:"home", categoryId:null };
    render();
    showStorage(`Ersetzt — ${plural(data.entries.length, "Zeile", "Zeilen")} übernommen.`);
  };

  document.getElementById("impMerge").onclick = () => {
    const map = {};
    incoming.categories.forEach(c => {
      const same = data.categories.find(x => x.name.toLowerCase() === String(c.name).toLowerCase());
      if(same){ map[c.id] = same.id; }
      else { const id = uid(); map[c.id] = id; data.categories.push({ id, name:c.name }); }
    });
    let added = 0;
    incoming.entries.forEach(e => {
      data.entries.push(Object.assign({}, e, { id: uid(), categoryId: map[e.categoryId] || e.categoryId }));
      added++;
    });
    writeThrough();
    view = { screen:"home", categoryId:null };
    render();
    showStorage(`Dazugenommen — ${plural(added, "Zeile", "Zeilen")} ergänzt.`);
  };
}

/* ============================================================
   Speicherhinweis
   ============================================================ */
function showStorage(message){
  const note = document.getElementById("dataNote");
  const bytes = new Blob([JSON.stringify(data)]).size;
  const size = bytes > 1048576 ? (bytes / 1048576).toFixed(1) + " MB" : Math.round(bytes / 1024) + " KB";
  const n = data.entries.length;
  note.innerHTML =
    (message ? `<b>${esc(message)}</b><br>` : "") +
    (droppedImages
      ? `<b>${plural(droppedImages, "gespeichertes Bild wurde", "gespeicherte Bilder wurden")} entfernt</b>, ` +
        `um Speicher freizugeben.<br>`
      : "") +
    `Alles bleibt auf diesem Gerät — <b>${n}</b> ${n === 1 ? "Zeile" : "Zeilen"}, ` +
    `zusammen <b>${size}</b>. ` +
    `Der Browser gibt dafür rund 5 MB frei; regelmäßig exportieren.`;
}

/* ============================================================
   Zeichnen
   ============================================================ */
function render(){
  if(query) renderSearch();
  else if(view.screen === "category") renderCategory(view.categoryId);
  else renderHome();
}
const scrollTop = () => window.scrollTo({ top:0, behavior:"smooth" });

render();
// Altbestände an Bildern sofort zurückschreiben, sonst belegen sie den
// Speicher weiter, obwohl sie nirgends mehr auftauchen.
if(droppedImages) writeThrough();
else showStorage();

})();
</script>
